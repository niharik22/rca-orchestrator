[project]
name = "rca-orchestrator"
version = "0.1.0"
description = "Local RCA orchestration CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0,<7",
]

[project.scripts]
rca-run = "rca_orchestrator.cli:run_main"
rca-show = "rca_orchestrator.cli:show_main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
